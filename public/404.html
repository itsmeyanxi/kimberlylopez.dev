<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found | Kimberly Lopez</title>
    <!-- Deliberately standalone: no fonts, no bundle, no React. A 404 has to
         render even when something else on the site is broken. -->
    <style>
      :root {
        color-scheme: light;
        --paper: #f5f1e8;
        --ink: #20241d;
        --muted: #5f6258;
        --faint: #656761;
        --accent: #566b47;
        --line: #d8d2c3;
      }
      :root[data-theme='dark'],
      html:not([data-theme='light']) {
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --paper: #111510;
          --ink: #ece9df;
          --muted: #b9bbaf;
          --faint: #94988b;
          --accent: #8ea47a;
          --line: #30382d;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 1.25rem;
        padding: 2rem clamp(1.25rem, 6vw, 4rem);
        background: var(--paper);
        color: var(--ink);
        font: 400 1rem/1.65 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--faint);
      }
      h1 {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(1.9rem, 5vw, 2.9rem);
        font-weight: 500;
        letter-spacing: -0.025em;
        line-height: 1.1;
      }
      p {
        margin: 0;
        max-width: 44ch;
        color: var(--muted);
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.5rem;
        margin-top: 0.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--line);
      }
      a {
        color: var(--accent);
        font-weight: 550;
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }
      a:hover,
      a:focus-visible {
        border-bottom-color: currentColor;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <p class="code">Error 404</p>
    <h1>That page doesn’t exist.</h1>
    <p>
      The link may be out of date, or the address mistyped. Everything on this
      site is reachable from the home page.
    </p>
    <nav class="links">
      <a href="/">Home</a>
      <a href="/#work">Selected work</a>
      <a href="/#experience">Experience</a>
      <a href="/#contact">Contact</a>
    </nav>
  </body>
</html>
